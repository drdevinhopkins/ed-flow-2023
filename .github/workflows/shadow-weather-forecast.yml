name: Shadow weather forecast

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/shadow-weather-forecast.yml'
      - 'scripts/evaluation/prospective/run_shadow_weather_forecast.py'
      - 'scripts/hourly_forecast_v2.py'
      - 'scripts/hourly_feature_routing.py'
      - 'scripts/backtest_hourly_final_features.py'
      - 'scripts/backtest_hourly_weather_features.py'
      - 'scripts/hourly_weather_features.py'

permissions:
  contents: read

jobs:
  shadow-weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            chronos-requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-shadow-weather-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt', 'scripts/hourly_forecast_v2.py', 'scripts/evaluation/prospective/run_shadow_weather_forecast.py') }}
          restore-keys: |
            huggingface-hourly-v2-${{ runner.os }}-
            huggingface-chronos2-${{ runner.os }}-
            huggingface-shadow-weather-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt
          pip install -r requirements.txt

      - name: Regression-test frozen paired inputs
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import pandas as pd

          path = Path('scripts/evaluation/prospective/run_shadow_weather_forecast.py')
          spec = importlib.util.spec_from_file_location('shadow_runner', path)
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)

          source_calls = {'flow': 0, 'weather': 0}
          flow = pd.DataFrame({'ds': pd.to_datetime(['2026-08-25 20:00:00'])})
          weather = pd.DataFrame({'ds': pd.to_datetime(['2026-08-25 20:00:00'])})

          original_flow = runner.forecast_v2.staffing_bt.load_flow
          original_weather = runner.forecast_v2.weather_bt.load_weather
          original_build = runner.forecast_v2.build_forecast_v2

          def source_flow():
              source_calls['flow'] += 1
              return flow.copy()

          def source_weather(_source):
              source_calls['weather'] += 1
              return weather.copy()

          def fake_build(_pipeline, *, allow_weather):
              seen_flow = runner.forecast_v2.staffing_bt.load_flow()
              seen_weather = runner.forecast_v2.weather_bt.load_weather('ignored')
              assert seen_flow.equals(flow)
              assert seen_weather.equals(weather)
              return pd.DataFrame({
                  'forecast_origin': [seen_flow['ds'].max()],
                  'route': ['weather' if allow_weather else 'safe'],
              })

          runner.forecast_v2.staffing_bt.load_flow = source_flow
          runner.forecast_v2.weather_bt.load_weather = source_weather
          runner.forecast_v2.build_forecast_v2 = fake_build
          try:
              safe, shadow, captured_weather = runner._run_paired_with_frozen_inputs(object())
          finally:
              runner.forecast_v2.staffing_bt.load_flow = original_flow
              runner.forecast_v2.weather_bt.load_weather = original_weather
              runner.forecast_v2.build_forecast_v2 = original_build

          assert source_calls == {'flow': 1, 'weather': 1}, source_calls
          assert safe['forecast_origin'].iloc[0] == shadow['forecast_origin'].iloc[0]
          assert captured_weather.equals(weather)
          print('Frozen-input regression test passed: one live flow/weather snapshot feeds both paired runs.')
          PY

      - name: Validate current forecast inputs
        run: python scripts/validate_forecast_inputs.py

      - name: Generate paired shadow forecast
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python scripts/evaluation/prospective/run_shadow_weather_forecast.py

      - name: Verify shadow-only outputs
        run: |
          test -s validation/prospective-weather/latest-run/shadow-weather-forecast.csv
          test -s validation/prospective-weather/latest-run/weather-snapshot.csv
          test -s validation/prospective-weather/latest-run/metadata.json
          test ! -e forecast-v2.csv
          test ! -e chronos_forecast.csv
          test ! -e ED_Hourly_Forecasts_Anomalies_v1.0.csv
          python - <<'PY'
          import pandas as pd

          path = 'validation/prospective-weather/latest-run/shadow-weather-forecast.csv'
          frame = pd.read_csv(path)
          assert len(frame) == 8 * 24, len(frame)
          assert frame['weather_snapshot_is_prospective'].astype(bool).all()
          assert not frame['baseline_weather_routing_enabled'].astype(bool).any()
          assert frame['weather_weather_routing_enabled'].astype(bool).all()
          assert frame[['baseline_prediction', 'weather_prediction']].notna().all().all()
          assert frame[['ds', 'target_name']].duplicated().sum() == 0
          assert frame['horizon_hour'].min() == 1
          assert frame['horizon_hour'].max() == 24
          weather_routes = frame['weather_scenario'].astype(str).str.startswith('weather')
          assert weather_routes.any(), 'Weather-enabled run did not select any weather route'
          print(frame.groupby(['target_name', 'weather_scenario']).size())
          print('Shadow forecast validated and persisted under validation namespace; production files untouched.')
          PY

      - name: Upload shadow forecast artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-weather-forecast-${{ github.run_id }}
          path: validation/prospective-weather/latest-run/
          if-no-files-found: warn
          retention-days: 90
