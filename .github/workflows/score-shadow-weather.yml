name: Score shadow weather forecast

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/score-shadow-weather.yml'
      - 'scripts/evaluation/prospective/score_shadow_weather_forecast.py'

permissions:
  contents: read

jobs:
  score-shadow-weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest immutable shadow forecast pointer
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import dropbox
          import requests

          required = ['DROPBOX_APP_KEY', 'DROPBOX_APP_SECRET', 'DROPBOX_REFRESH_TOKEN']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError(f'Missing Dropbox secrets: {missing}')

          response = requests.post(
              'https://api.dropboxapi.com/oauth2/token',
              data={
                  'grant_type': 'refresh_token',
                  'refresh_token': os.environ['DROPBOX_REFRESH_TOKEN'],
                  'client_id': os.environ['DROPBOX_APP_KEY'],
                  'client_secret': os.environ['DROPBOX_APP_SECRET'],
              },
              timeout=30,
          )
          response.raise_for_status()
          dbx = dropbox.Dropbox(response.json()['access_token'])
          _metadata, payload = dbx.files_download(
              '/validation/prospective-weather/latest-shadow-weather-forecast.csv'
          )
          Path('shadow-weather-forecast.csv').write_bytes(payload.content)
          print('Downloaded latest prospective shadow forecast')
          PY

      - name: Score matured rows only
        run: |
          python scripts/evaluation/prospective/score_shadow_weather_forecast.py \
            shadow-weather-forecast.csv \
            --output-dir validation/prospective-weather/latest-score

      - name: Verify scorer safety
        run: |
          test -s shadow-weather-forecast.csv
          test ! -e forecast-v2.csv
          test ! -e chronos_forecast.csv
          test ! -e ED_Hourly_Forecasts_Anomalies_v1.0.csv
          echo 'Scoring remained shadow-only; production artifacts untouched.'

      - name: Upload score artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-weather-score
          path: |
            validation/prospective-weather/latest-score/*.csv
            shadow-weather-forecast.csv
          if-no-files-found: warn
          retention-days: 90
