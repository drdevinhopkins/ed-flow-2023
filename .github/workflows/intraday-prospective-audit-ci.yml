name: Intraday prospective audit CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/evaluation/prospective/audit_intraday_forecasts.py'
      - 'scripts/daily_arrival_quality.py'
      - 'tests/test_intraday_prospective_audit.py'
      - '.github/workflows/intraday-prospective-audit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - run: python -m unittest discover -s tests -p test_intraday_prospective_audit.py -v
