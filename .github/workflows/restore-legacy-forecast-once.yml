name: Restore legacy forecast outputs once

on:
  push:
    branches:
      - chronos2-hourly-target-routing
    paths:
      - '.github/workflows/restore-legacy-forecast-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chronos2-hourly-target-routing

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            chronos-requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-legacy-restore-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt', 'scripts/chronos_forecast.py') }}
          restore-keys: |
            huggingface-chronos2-${{ runner.os }}-
            huggingface-hourly-v2-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt
          pip install -r requirements.txt

      - name: Validate current forecast inputs
        run: python scripts/validate_forecast_inputs.py

      - name: Restore untouched legacy outputs
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/chronos_forecast.py

      - name: Record successful restore
        run: |
          mkdir -p validation/legacy-restore
          printf 'run_id=%s\nsha=%s\nstatus=success\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > validation/legacy-restore/status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/legacy-restore/status.txt
          git commit -m 'Record legacy forecast restore [skip ci]' || exit 0
          git push origin HEAD:chronos2-hourly-target-routing
