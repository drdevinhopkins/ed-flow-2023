name: Hourly routed history-window backtest

on:
  workflow_dispatch:
  push:
    branches:
      - chronos2-history-window-backtest
    paths:
      - '.github/workflows/hourly-history-window-routed-backtest.yml'
      - 'chronos-requirements.txt'
      - 'scripts/backtest_hourly_history_windows_routed.py'
      - 'scripts/backtest_hourly_history_windows.py'
      - 'scripts/backtest_hourly_final_features.py'
      - 'scripts/backtest_hourly_calendar_features.py'
      - 'scripts/backtest_staffing_features.py'
      - 'scripts/backtest_covariate_ablation.py'
      - 'scripts/hourly_feature_routing.py'
      - 'scripts/hourly_calendar_features.py'
      - 'scripts/staffing_features.py'
      - 'scripts/forecast_oncall_impact.py'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out history-window branch
        uses: actions/checkout@v7

      - name: Record run id
        run: |
          mkdir -p validation/hourly-history-window-routed
          printf 'run_id=%s\nrun_number=%s\nsha=%s\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.sha }}' \
            > validation/hourly-history-window-routed/run-id.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chronos-requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-hourly-history-routed-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt') }}
          restore-keys: |
            huggingface-hourly-history-routed-${{ runner.os }}-
            huggingface-hourly-history-${{ runner.os }}-
            huggingface-hourly-final-${{ runner.os }}-
            huggingface-chronos2-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt

      - name: Compile routed backtest
        run: |
          python -m py_compile scripts/backtest_hourly_history_windows_routed.py

      - name: Run production-routed history-window comparison
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p validation-output-hourly-history-routed
          set +e
          python scripts/backtest_hourly_history_windows_routed.py \
            --horizon 24 \
            --num-cutoffs 8 \
            --spacing-hours 1008 \
            --windows-days 30 60 90 180 270 365 \
            --output-dir validation-output-hourly-history-routed \
            2>&1 | tee validation-output-hourly-history-routed/run.log
          status=${PIPESTATUS[0]}
          echo "$status" > validation-output-hourly-history-routed/exit_code.txt
          exit 0

      - name: Upload routed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos2-hourly-history-window-routed-backtest
          path: validation-output-hourly-history-routed/*
          if-no-files-found: warn

      - name: Record latest routed results on branch
        if: always()
        run: |
          mkdir -p validation/hourly-history-window-routed
          for file in \
            cutoffs.csv \
            summary.csv \
            by_horizon_band.csv \
            by_cutoff.csv \
            global_ranking.csv \
            winners_by_target.csv \
            winners_by_target_horizon_band.csv \
            route_mix.csv \
            exit_code.txt; do
            if [ -f "validation-output-hourly-history-routed/$file" ]; then
              cp "validation-output-hourly-history-routed/$file" \
                "validation/hourly-history-window-routed/$file"
            fi
          done
          if [ -f validation-output-hourly-history-routed/run.log ]; then
            tail -n 2000 validation-output-hourly-history-routed/run.log \
              > validation/hourly-history-window-routed/latest.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f validation/hourly-history-window-routed
          if ! git diff --cached --quiet; then
            git commit -m "Record routed history-window backtest results [skip ci]"
            git push
          fi

      - name: Fail if routed backtest failed
        if: always()
        run: |
          test -f validation-output-hourly-history-routed/exit_code.txt
          test "$(cat validation-output-hourly-history-routed/exit_code.txt)" = "0"
