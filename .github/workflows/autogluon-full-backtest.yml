name: AutoGluon full backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autogluon

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install AutoGluon dependencies
        run: python -m pip install -r requirements-autogluon.txt

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Run 14-day leakage-safe backtest
        env:
          AUTOGLUON_VALIDATION_WINDOWS: '3'
          AUTOGLUON_HOLDOUT_WINDOWS: '14'
          AUTOGLUON_VAL_STEP_SIZE: '24'
          AUTOGLUON_TIME_LIMIT: '1800'
          AUTOGLUON_BATCH_SIZE: '8'
          AUTOGLUON_INCLUDE_WEATHER: '0'
        run: python scripts/autogluon_backtest_safe.py

      - name: Show headline outputs
        if: always()
        run: |
          ls -lh autogluon_*.csv 2>/dev/null || true
          for f in autogluon_leaderboard.csv autogluon_backtest_overview.csv autogluon_backtest_summary.csv autogluon_backtest_horizons.csv; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              head -n 100 "$f"
            fi
          done

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autogluon-14day-backtest-no-weather
          path: autogluon_*.csv
          if-no-files-found: warn
