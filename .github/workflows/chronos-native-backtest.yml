name: Native Chronos-2 backtest

on:
  push:
    branches: [autogluon]
    paths:
      - '.github/workflows/chronos-native-backtest.yml'
      - 'scripts/chronos_native_backtest.py'
      - 'scripts/autogluon_backtest.py'
      - 'scripts/autogluon_backtest_safe.py'
      - 'scripts/chronos_forecast_autogluon.py'
      - 'requirements-autogluon.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/chronos-native-backtest.yml'
      - 'scripts/chronos_native_backtest.py'
      - 'scripts/autogluon_backtest.py'
      - 'scripts/autogluon_backtest_safe.py'
      - 'scripts/chronos_forecast_autogluon.py'
      - 'requirements-autogluon.txt'
  workflow_dispatch:

jobs:
  native-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autogluon

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install benchmark dependencies
        run: python -m pip install -r requirements-autogluon.txt

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Run native Chronos-2 14-day leakage-safe backtest
        env:
          AUTOGLUON_VALIDATION_WINDOWS: '3'
          AUTOGLUON_HOLDOUT_WINDOWS: '14'
          AUTOGLUON_VAL_STEP_SIZE: '24'
          AUTOGLUON_INCLUDE_WEATHER: '0'
          NATIVE_CHRONOS_BATCH_SIZE: '32'
          NATIVE_CHRONOS_CROSS_LEARNING: '0'
        run: python scripts/chronos_native_backtest.py

      - name: Show headline outputs
        if: always()
        run: |
          ls -lh native_chronos_*.csv 2>/dev/null || true
          for f in native_chronos_backtest_summary.csv native_chronos_backtest_horizons.csv native_chronos_backtest_runtime.csv; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              head -n 120 "$f"
            fi
          done

      - name: Upload native benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-chronos2-14day-no-weather
          path: native_chronos_*.csv
          if-no-files-found: warn
