name: ED forecast operational blurb append

on:
  push:
    branches:
      - ed-forecast-blurb-trigger
    paths:
      - '.github/ed_forecast_blurb_request.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ed-forecast-blurb.yml'
      - 'scripts/append_ed_forecast_blurb_request.py'
      - 'scripts/generate_ed_forecast_blurb.py'
      - '.github/ed_forecast_blurb_request.json'

permissions:
  contents: read

concurrency:
  group: ed-forecast-operational-blurb-append
  cancel-in-progress: false

jobs:
  append-blurb:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests dropbox

      - name: Compile append worker
        run: |
          python -m py_compile scripts/generate_ed_forecast_blurb.py
          python -m py_compile scripts/append_ed_forecast_blurb_request.py

      - name: Validate or append exact requested blurb
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          if [ ! -f .github/ed_forecast_blurb_request.json ]; then
            echo 'No blurb request file in this ref; compile validation only.'
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/append_ed_forecast_blurb_request.py --dry-run
          else
            python scripts/append_ed_forecast_blurb_request.py
          fi

      - name: Upload appended row for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ed-forecast-blurb-row
          path: ed_forecast_blurb_row.csv
          if-no-files-found: ignore
