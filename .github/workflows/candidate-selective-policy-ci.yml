name: Candidate selective-policy CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/evaluation/prospective/summarize_shadow_candidate_selective_policies.py'
      - '.github/workflows/candidate-selective-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-candidate-selective-policies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lightweight dependencies
        run: pip install pandas numpy

      - name: Verify selective counterfactual with real scorer schema
        run: |
          python - <<'PY'
          import sys
          import pandas as pd
          sys.path.insert(0, 'scripts/evaluation/prospective')
          from summarize_shadow_candidate_selective_policies import summarize

          rows = []
          # Candidate is harmful at h1 but helpful at h2-h4. The best selective
          # policy should therefore retain baseline at h1 and use candidate at h2-h4.
          for run in range(4):
              for hour, baseline_error, candidate_error in [
                  (1, 1.0, 3.0),
                  (2, 3.0, 1.0),
                  (3, 4.0, 1.0),
                  (4, 5.0, 1.0),
              ]:
                  actual = 10.0
                  rows.append({
                      'forecast_run_id': f'run-{run}',
                      'forecast_issued_at': f'2026-08-27T{12+run:02d}:00:00Z',
                      'target_ds': f'2026-08-28T{hour:02d}:00:00',
                      'target_name': 'Workup_Delay_Burden',
                      'horizon_band': 'h01_04',
                      'horizon_hour': hour,
                      'candidate_scenario': 'staffing_current',
                      'candidate_route_active': True,
                      'actual': actual,
                      'baseline_prediction': actual + baseline_error,
                      'candidate_prediction': actual + candidate_error,
                  })
          pooled, by_date = summarize(pd.DataFrame(rows))
          target = pooled[
              pooled.target_name.eq('Workup_Delay_Burden')
              & pooled.horizon_band.eq('h01_04')
          ]
          winner = target.sort_values(['policy_mae', 'policy']).iloc[0]
          assert winner.policy == 'candidate_hours_2_3_4', winner
          assert winner.mae_improvement_pct > 0, winner
          baseline = target[target.policy.eq('baseline')].iloc[0]
          current = target[target.policy.eq('candidate_hours_1_2_3_4')].iloc[0]
          assert winner.policy_mae < current.policy_mae < baseline.policy_mae, target
          assert winner.n_unique_target_hours == 4
          assert not by_date.empty
          print(target[['policy','policy_mae','mae_improvement_pct']].to_string(index=False))
          PY
