name: Triage hallway feature ablation

on:
  push:
    branches:
      - forecast-triage-hallway
    paths:
      - '.github/workflows/triage-hallway-ablation.yml'
      - 'scripts/evaluation/backtests/backtest_triage_hallway_cutoff.py'
      - 'scripts/evaluation/backtests/summarize_triage_hallway_ablation.py'
      - 'scripts/backtest_covariate_ablation.py'
      - 'scripts/backtest_hourly_final_features.py'
      - 'scripts/backtest_hourly_calendar_features.py'
      - 'scripts/backtest_hourly_weather_features.py'
      - 'scripts/backtest_staffing_features.py'
      - 'scripts/hourly_calendar_features.py'
      - 'scripts/hourly_weather_features.py'
      - 'scripts/staffing_features.py'
      - 'scripts/forecast_oncall_impact.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: scripts

jobs:
  ablation-cutoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cutoff_index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chronos-requirements.txt
      - name: Cache Chronos model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-triage-hallway-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt') }}
          restore-keys: |
            huggingface-hourly-final-${{ runner.os }}-
            huggingface-chronos2-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt
      - name: Compile cutoff runner
        run: |
          python -m py_compile scripts/evaluation/backtests/backtest_triage_hallway_cutoff.py
          python -m py_compile scripts/evaluation/backtests/summarize_triage_hallway_ablation.py
      - name: Run one common cutoff across all feature families
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p cutoff-output
          python scripts/evaluation/backtests/backtest_triage_hallway_cutoff.py \
            --cutoff-index '${{ matrix.cutoff_index }}' \
            --horizon 24 \
            --num-cutoffs 8 \
            --spacing-hours 168 \
            --max-history-days 365 \
            --min-history-hours 672 \
            --effect-min-hours 24 \
            --effect-shrinkage-hours 72 \
            --output-dir cutoff-output
      - name: Upload cutoff result
        uses: actions/upload-artifact@v4
        with:
          name: triage-hallway-cutoff-${{ matrix.cutoff_index }}
          path: cutoff-output/*
          if-no-files-found: error

  aggregate:
    needs: ablation-cutoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install aggregation dependencies
        run: pip install pandas numpy
      - name: Download cutoff results
        uses: actions/download-artifact@v5
        with:
          pattern: triage-hallway-cutoff-*
          path: matrix-results
      - name: Aggregate apples-to-apples results
        run: |
          mkdir -p validation-output-triage-hallway
          python scripts/evaluation/backtests/summarize_triage_hallway_ablation.py \
            --input-dir matrix-results \
            --output-dir validation-output-triage-hallway \
            --expected-cutoffs 8
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          paths = sorted(Path('matrix-results').rglob('cutoff-*.csv'))
          cutoffs = pd.concat((pd.read_csv(path) for path in paths), ignore_index=True)
          cutoffs.sort_values('cutoff_index').to_csv(
              'validation-output-triage-hallway/cutoffs.csv', index=False
          )
          PY
          printf '0\n' > validation-output-triage-hallway/exit_code.txt
      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: triage-hallway-feature-ablation
          path: validation-output-triage-hallway/*
          if-no-files-found: error
      - name: Record results on branch
        run: |
          git fetch origin forecast-triage-hallway
          git reset --hard origin/forecast-triage-hallway
          mkdir -p validation/triage-hallway-ablation
          cp validation-output-triage-hallway/* validation/triage-hallway-ablation/
          printf 'run_id=%s\nrun_number=%s\nsha=%s\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.sha }}' \
            > validation/triage-hallway-ablation/run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f validation/triage-hallway-ablation
          if ! git diff --cached --quiet; then
            git commit -m 'Record triage hallway feature ablation results [skip ci]'
            git push origin HEAD:forecast-triage-hallway
          fi
