name: Candidate confidence diagnostics CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/candidate-confidence-ci.yml'
      - 'scripts/evaluation/prospective/summarize_shadow_candidate_confidence.py'

permissions:
  contents: read

jobs:
  candidate-confidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Verify complete-date confidence gating
        run: |
          python - <<'PY'
          import pandas as pd
          rows = []
          # Two complete dates, both favorable: interval may be exploratory but must not
          # become a formal confidence claim before 28 complete issue dates.
          for issue_date, delta in [('2026-08-01', 1.0), ('2026-08-02', 2.0)]:
              for h in range(1, 5):
                  rows.append({
                      'target_name': 'Inflow_Total',
                      'horizon_band': 'h01_04',
                      'candidate_scenario': 'calendar_demand',
                      'forecast_issue_date': issue_date,
                      'candidate_route_active': True,
                      'baseline_absolute_error': 5.0,
                      'paired_absolute_error_delta': delta,
                  })
          # Recent incomplete date is deliberately harmful and must not enter the formal bootstrap.
          for h in range(1, 5):
              rows.append({
                  'target_name': 'Inflow_Total',
                  'horizon_band': 'h01_04',
                  'candidate_scenario': 'calendar_demand',
                  'forecast_issue_date': '2026-08-03',
                  'candidate_route_active': True,
                  'baseline_absolute_error': 5.0,
                  'paired_absolute_error_delta': -20.0,
              })
          pd.DataFrame(rows).to_csv('/tmp/candidate-detail.csv', index=False)
          PY
          python scripts/evaluation/prospective/summarize_shadow_candidate_confidence.py \
            /tmp/candidate-detail.csv --output-dir /tmp/confidence --as-of '2026-08-04T02:00:00-04:00'
          python - <<'PY'
          import pandas as pd
          out = pd.read_csv('/tmp/confidence/candidate-route-confidence.csv').iloc[0]
          assert int(out['n_complete_issue_dates']) == 2, out
          assert out['mean_paired_mae_delta'] > 0, out
          assert out['exploratory_ci_direction'] == 'supports_improvement', out
          assert str(out['confidence_status']) == 'insufficient_complete_issue_dates', out
          assert str(out['confidence_evidence_ready']).lower() == 'false', out
          print(out.to_string())
          PY
