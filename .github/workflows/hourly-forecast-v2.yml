name: Hourly forecast v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hourly-forecast-v2.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect-v2-runs:
    runs-on: ubuntu-24.04
    steps:
      - name: List Hourly forecast v2 runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/340870190/runs?per_page=50" \
            > /tmp/runs.json
          python - <<'PY'
          import json
          with open('/tmp/runs.json') as f:
              data = json.load(f)
          for r in data.get('workflow_runs', []):
              print(
                  'RUN',
                  f"number={r['run_number']}",
                  f"id={r['id']}",
                  f"status={r['status']}",
                  f"conclusion={r['conclusion']}",
                  f"event={r['event']}",
                  f"created={r['created_at']}",
                  f"head_sha={r['head_sha']}",
                  f"head_branch={r['head_branch']}",
              )
          PY
