name: Hourly forecast v2

on:
  workflow_run:
    workflows: ["Hourly update"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hourly-forecast-v2.yml'
      - 'scripts/hourly_forecast_v2.py'
      - 'scripts/hourly_feature_routing.py'
      - 'scripts/backtest_covariate_ablation.py'
      - 'scripts/backtest_hourly_final_features.py'
      - 'scripts/backtest_staffing_features.py'
      - 'scripts/backtest_hourly_calendar_features.py'
      - 'scripts/backtest_hourly_weather_features.py'
      - 'scripts/staffing_features.py'
      - 'scripts/hourly_calendar_features.py'
      - 'scripts/hourly_weather_features.py'

permissions:
  contents: read

jobs:
  forecast-v2:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            chronos-requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-hourly-v2-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt', 'scripts/hourly_forecast_v2.py', 'scripts/hourly_feature_routing.py') }}
          restore-keys: |
            huggingface-chronos2-${{ runner.os }}-
            huggingface-hourly-final-${{ runner.os }}-
            huggingface-hourly-v2-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt
          pip install -r requirements.txt

      - name: Validate current forecast inputs
        run: python scripts/validate_forecast_inputs.py

      - name: Generate forecast v2 only
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHRONOS_HOURLY_ENABLE_WEATHER_ROUTING: '0'
        run: python scripts/hourly_forecast_v2.py

      - name: Verify additive-only v2 output
        run: |
          test -s forecast-v2.csv
          test ! -e chronos_forecast.csv
          test ! -e ED_Hourly_Forecasts_Anomalies_v1.0.csv
          test ! -e forecast_variable_effects.csv
          test ! -e forecast_variable_effects_hourly.csv
          python - <<'PY'
          import sys
          import pandas as pd

          sys.path.insert(0, 'scripts')
          from hourly_forecast_v2 import AMBER, GREEN, RED, _anomaly_values

          frame = pd.read_csv('forecast-v2.csv')
          expected_targets = {
              'Total_TBS', 'POD_TBS', 'Vertical_TBS',
              'TTStr', 'Overflow', 'WAITINGADM',
              'TRG_HALLWAY1', 'TRG_HALLWAY_TBS'
          }
          required = {
              'ds', 'target_name', 'actual', 'forecast',
              'forecast_lower', 'forecast_upper',
              'anomaly_yhat', 'anomaly_yhat_lower', 'anomaly_yhat_upper',
              'actual_anomaly', 'actual_colour',
              'forecast_anomaly', 'forecast_colour',
              'row_type', 'horizon_hour', 'horizon_band',
              'scenario', 'feature_family', 'forecast_origin',
              'generated_at_utc', 'routing_version',
              'weather_routing_enabled'
          }
          assert required.issubset(frame.columns), sorted(required - set(frame.columns))
          assert len(frame) == 384, len(frame)
          assert set(frame['target_name']) == expected_targets
          assert set(frame['row_type']) == {'observed', 'forecast'}
          assert not frame[['ds', 'target_name']].duplicated().any()

          observed = frame[frame['row_type'].eq('observed')].copy()
          future = frame[frame['row_type'].eq('forecast')].copy()
          assert len(observed) == 192, len(observed)
          assert len(future) == 192, len(future)
          assert observed.groupby('target_name').size().eq(24).all()
          assert future.groupby('target_name').size().eq(24).all()

          assert observed['actual'].notna().all()
          assert observed['forecast'].isna().all()
          assert observed['forecast_lower'].isna().all()
          assert observed['forecast_upper'].isna().all()
          assert observed['actual_anomaly'].isin(['yes', 'no']).all()
          assert observed['actual_colour'].isin([RED, AMBER, GREEN]).all()
          assert observed['forecast_anomaly'].isna().all()
          assert observed['forecast_colour'].isna().all()
          assert observed['horizon_hour'].isna().all()

          # Directional historical colouring: low congestion is favorable.
          expected_actual_colour = pd.Series(GREEN, index=observed.index)
          expected_actual_colour.loc[
              observed['actual'] > observed['anomaly_yhat']
          ] = AMBER
          expected_actual_colour.loc[
              observed['actual'] > observed['anomaly_yhat_upper']
          ] = RED
          assert observed['actual_colour'].eq(expected_actual_colour).all()

          # Synthetic regression cases ensure both anomaly tails are exercised.
          stamp = pd.Timestamp('2026-01-01 12:00:00')
          ranges = pd.DataFrame({
              'ds': [stamp],
              'total_tbs_yhat': [10.0],
              'total_tbs_yhat_lower': [5.0],
              'total_tbs_yhat_upper': [20.0],
          })
          assert _anomaly_values(
              ranges, target='Total_TBS', stamp=stamp, value=4.0, historical=True
          )['colour'] == GREEN
          assert _anomaly_values(
              ranges, target='Total_TBS', stamp=stamp, value=15.0, historical=True
          )['colour'] == AMBER
          assert _anomaly_values(
              ranges, target='Total_TBS', stamp=stamp, value=21.0, historical=True
          )['colour'] == RED
          assert _anomaly_values(
              ranges, target='Total_TBS', stamp=stamp, value=4.0, historical=False
          )['colour'] == RED

          assert future['actual'].isna().all()
          assert future[['forecast', 'forecast_lower', 'forecast_upper']].notna().all().all()
          assert future['actual_anomaly'].isna().all()
          assert future['actual_colour'].isna().all()
          assert future['forecast_anomaly'].isin(['yes', 'no']).all()
          assert future['forecast_colour'].isin([RED, AMBER, GREEN]).all()
          assert future['horizon_hour'].min() == 1
          assert future['horizon_hour'].max() == 24
          assert future.loc[
              future['target_name'].isin(['TRG_HALLWAY1', 'TRG_HALLWAY_TBS']), 'scenario'
          ].eq('baseline').all()

          assert frame[['anomaly_yhat', 'anomaly_yhat_lower', 'anomaly_yhat_upper']].notna().all().all()
          assert not frame['weather_routing_enabled'].astype(bool).any()
          assert not future['scenario'].str.startswith('weather').any()

          observed_times = pd.to_datetime(observed['ds']).drop_duplicates().sort_values()
          future_times = pd.to_datetime(future['ds']).drop_duplicates().sort_values()
          assert len(observed_times) == 24
          assert len(future_times) == 24
          assert observed_times.max() < future_times.min()
          assert future_times.min() - observed_times.max() == pd.Timedelta(hours=1)

          print(frame.groupby(['row_type', 'target_name']).size())
          print('forecast-v2.csv validated: eight targets, directional actual colours, separate observed/forecast columns, legacy files untouched.')
          PY

      - name: Upload v2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-v2
          path: forecast-v2.csv
          if-no-files-found: warn
