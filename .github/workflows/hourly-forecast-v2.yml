name: Hourly forecast v2

on:
  workflow_run:
    workflows: ["Hourly update"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hourly-forecast-v2.yml'
      - 'scripts/chronos_forecast_v2.py'
      - 'scripts/hourly_feature_routing.py'
      - 'scripts/backtest_hourly_final_features.py'
      - 'scripts/backtest_staffing_features.py'
      - 'scripts/backtest_hourly_calendar_features.py'
      - 'scripts/backtest_hourly_weather_features.py'
      - 'scripts/staffing_features.py'
      - 'scripts/hourly_calendar_features.py'
      - 'scripts/hourly_weather_features.py'

permissions:
  contents: read

jobs:
  forecast-v2:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            chronos-requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-hourly-v2-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt', 'scripts/chronos_forecast_v2.py', 'scripts/hourly_feature_routing.py') }}
          restore-keys: |
            huggingface-chronos2-${{ runner.os }}-
            huggingface-hourly-final-${{ runner.os }}-
            huggingface-hourly-v2-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt
          pip install -r requirements.txt

      - name: Validate current forecast inputs
        run: python scripts/validate_forecast_inputs.py

      - name: Generate forecast v2 only
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHRONOS_HOURLY_ENABLE_WEATHER_ROUTING: '0'
        run: python scripts/chronos_forecast_v2.py

      - name: Verify additive-only v2 output
        run: |
          test -s forecast-v2.csv
          test ! -e chronos_forecast.csv
          test ! -e ED_Hourly_Forecasts_Anomalies_v1.0.csv
          test ! -e forecast_variable_effects.csv
          test ! -e forecast_variable_effects_hourly.csv
          python - <<'PY'
          import pandas as pd

          frame = pd.read_csv('forecast-v2.csv')
          expected_targets = {
              'Total_TBS', 'POD_TBS', 'Vertical_TBS',
              'TTStr', 'Overflow', 'WAITINGADM'
          }
          required = {
              'ds', 'target_name', 'forecast', 'forecast_lower', 'forecast_upper',
              'horizon_hour', 'horizon_band', 'scenario', 'feature_family',
              'forecast_origin', 'generated_at_utc', 'routing_version',
              'weather_routing_enabled'
          }
          assert required.issubset(frame.columns), sorted(required - set(frame.columns))
          assert len(frame) == 144, len(frame)
          assert set(frame['target_name']) == expected_targets
          assert not frame[['forecast', 'forecast_lower', 'forecast_upper']].isna().any().any()
          assert frame['horizon_hour'].min() == 1
          assert frame['horizon_hour'].max() == 24
          assert not frame['weather_routing_enabled'].astype(bool).any()
          assert not frame['scenario'].str.startswith('weather').any()
          assert not frame[['ds', 'target_name']].duplicated().any()
          print(frame.groupby(['target_name', 'scenario']).size())
          print('forecast-v2.csv validated; legacy forecast files were not created or modified.')
          PY

      - name: Upload v2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-v2
          path: forecast-v2.csv
          if-no-files-found: warn
