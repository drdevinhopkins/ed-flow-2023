name: Hourly forecast v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hourly-forecast-v2.yml'

permissions:
  contents: read

jobs:
  forecast-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            chronos-requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-hourly-v2-debug-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt', 'scripts/hourly_forecast_v2.py', 'scripts/hourly_feature_routing.py') }}
          restore-keys: |
            huggingface-hourly-v2-${{ runner.os }}-
            huggingface-chronos2-${{ runner.os }}-
            huggingface-hourly-final-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt
          pip install -r requirements.txt

      - name: Validate current forecast inputs
        run: python scripts/validate_forecast_inputs.py

      - name: Generate forecast v2 only
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHRONOS_HOURLY_ENABLE_WEATHER_ROUTING: '0'
        run: python scripts/hourly_forecast_v2.py

      - name: Verify output exists
        run: |
          test -s forecast-v2.csv
          python - <<'PY'
          import pandas as pd
          frame = pd.read_csv('forecast-v2.csv')
          assert len(frame) == 288, len(frame)
          print(frame.groupby(['row_type', 'target_name']).size())
          PY

      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-v2-debug
          path: forecast-v2.csv
          if-no-files-found: warn
