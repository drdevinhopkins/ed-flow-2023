name: Hourly forecast v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hourly-forecast-v2.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect-v2-runs:
    runs-on: ubuntu-24.04
    steps:
      - name: List Hourly forecast v2 runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/340870190/runs?per_page=50" \
            | python -c 'import json,sys; d=json.load(sys.stdin); [print(f"RUN number={r[\"run_number\"]} id={r[\"id\"]} status={r[\"status\"]} conclusion={r[\"conclusion\"]} event={r[\"event\"]} created={r[\"created_at\"]} head_sha={r[\"head_sha\"]} head_branch={r[\"head_branch\"]}") for r in d.get("workflow_runs", [])]'
