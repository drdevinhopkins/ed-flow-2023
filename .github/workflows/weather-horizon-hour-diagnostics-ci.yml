name: Weather horizon-hour diagnostics CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/weather-horizon-hour-diagnostics-ci.yml'
      - 'scripts/evaluation/prospective/summarize_shadow_weather_by_horizon_hour.py'

permissions:
  contents: read

jobs:
  test-horizon-hour-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Verify exact lead-hour separation
        run: |
          python - <<'PY'
          import pandas as pd
          rows = []
          for date in ['2026-08-25', '2026-08-26']:
              for h, delta in [(1, 0.0), (2, 0.1), (3, 0.5), (4, 1.0)]:
                  for rep in range(2):
                      baseline_abs = 4.0
                      weather_abs = baseline_abs - delta
                      rows.append({
                          'forecast_run_id': f'{date}-{h}-{rep}',
                          'target_name': 'Total_TBS',
                          'horizon_band': 'h01_04',
                          'horizon_hour': h,
                          'forecast_issued_at': f'{date}T12:00:00Z',
                          'baseline_abs_error': baseline_abs,
                          'weather_abs_error': weather_abs,
                          'baseline_error': baseline_abs,
                          'weather_error': weather_abs,
                          'baseline_scenario': 'staffing_current',
                          'weather_scenario': 'weather_raw_plus_snow',
                      })
          pd.DataFrame(rows).to_csv('/tmp/detail.csv', index=False)
          PY
          python scripts/evaluation/prospective/summarize_shadow_weather_by_horizon_hour.py \
            /tmp/detail.csv --output-dir /tmp/out
          python - <<'PY'
          import pandas as pd
          x = pd.read_csv('/tmp/out/weather-route-by-horizon-hour.csv').sort_values('horizon_hour')
          assert x['horizon_hour'].tolist() == [1,2,3,4]
          assert abs(x.loc[x.horizon_hour.eq(1), 'mae_improvement_pct'].iloc[0]) < 1e-9
          assert x.loc[x.horizon_hour.eq(4), 'mae_improvement_pct'].iloc[0] > x.loc[x.horizon_hour.eq(3), 'mae_improvement_pct'].iloc[0]
          b = pd.read_csv('/tmp/out/weather-route-by-horizon-hour-balanced.csv')
          assert b['n_issue_dates'].eq(2).all()
          print('Exact lead-hour diagnostic separates h1-h4 and balances by issue date.')
          PY
