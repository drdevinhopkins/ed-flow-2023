name: Recover hourly history October 2026

on:
  push:
    branches: [backfill/hourly-history-october-2026]
    paths:
      - scripts/backfill_hourly_history.py
      - .github/workflows/backfill-hourly-history.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backfill-hourly-history-october-2026
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/backfill/hourly-history-october-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: python -m pip install pandas==2.2.3 PyMuPDF==1.26.6 openpyxl==3.1.5 dropbox
      - name: Recover and verify missing observed hours
        run: >-
          python scripts/backfill_hourly_history.py
          --start '2026-10-02 15:00:00'
          --end '2026-10-04 08:00:00'
          --expected-hours 42
          --publish-dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      - name: Show recovery audit
        if: always()
        run: |
          if [ -f backfill-output/audit.json ]; then
            cat backfill-output/audit.json
          fi
