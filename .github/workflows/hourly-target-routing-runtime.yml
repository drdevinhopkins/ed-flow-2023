name: Hourly target routing runtime smoke

on:
  workflow_dispatch:
  push:
    branches:
      - chronos2-hourly-target-routing
    paths:
      - '.github/workflows/hourly-target-routing-runtime.yml'
      - 'scripts/chronos_forecast_routed.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hourly-target-routing-runtime.yml'
      - '.github/workflows/hourly-update.yml'
      - 'scripts/chronos_forecast_routed.py'
      - 'scripts/hourly_feature_routing.py'
      - 'scripts/backtest_hourly_final_features.py'
      - 'scripts/backtest_staffing_features.py'
      - 'scripts/backtest_hourly_calendar_features.py'
      - 'scripts/backtest_hourly_weather_features.py'
      - 'scripts/staffing_features.py'
      - 'scripts/hourly_calendar_features.py'
      - 'scripts/hourly_weather_features.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out routing branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            chronos-requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-hourly-routing-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt', 'scripts/chronos_forecast_routed.py', 'scripts/hourly_feature_routing.py') }}
          restore-keys: |
            huggingface-chronos2-${{ runner.os }}-
            huggingface-hourly-final-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt
          pip install -r requirements.txt

      - name: Validate current forecast inputs
        run: python scripts/validate_forecast_inputs.py

      - name: Run target-routed hourly forecast
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHRONOS_HOURLY_ENABLE_WEATHER_ROUTING: '0'
        run: python scripts/chronos_forecast_routed.py

      - name: Verify routing outputs
        run: |
          test -s hourly_feature_routing.csv
          test -s chronos_forecast.csv
          test -s ED_Hourly_Forecasts_Anomalies_v1.0.csv
          python - <<'PY'
          import numpy as np
          import pandas as pd

          aliases = {
              'Total_TBS': 'total_tbs',
              'POD_TBS': 'pod_tbs',
              'Vertical_TBS': 'vert_tbs',
              'TTStr': 'TTStr',
              'Overflow': 'overflow',
              'WAITINGADM': 'WAITINGADM',
          }

          routed = pd.read_csv('hourly_feature_routing.csv')
          routed['ds'] = pd.to_datetime(routed['ds'], format='mixed')
          assert len(routed) == 6 * 24, len(routed)
          assert routed['target_name'].nunique() == 6
          assert routed['horizon_hour'].min() == 1
          assert routed['horizon_hour'].max() == 24
          assert not routed['weather_routing_enabled'].astype(bool).any()
          assert not routed['scenario'].str.startswith('weather').any()

          long = pd.read_csv('chronos_forecast.csv')
          long['ds'] = pd.to_datetime(long['ds'], format='mixed')
          wide = pd.read_csv('ED_Hourly_Forecasts_Anomalies_v1.0.csv')
          wide['ds'] = pd.to_datetime(wide['ds'], format='mixed')

          for canonical, legacy in aliases.items():
              expected = routed.loc[routed['target_name'].eq(canonical)].copy()
              assert len(expected) == 24

              # Long production file must contain all 24 routed values under the legacy target name.
              actual_long = long.loc[long['target_name'].eq(legacy)].merge(
                  expected[['ds', 'predictions', 'scenario']], on='ds', how='inner'
              )
              assert len(actual_long) == 24, (canonical, len(actual_long))
              assert actual_long['routed_scenario'].notna().all(), canonical
              assert (actual_long['routed_scenario'] == actual_long['scenario']).all(), canonical
              assert np.allclose(
                  actual_long['forecast_all_vars_with_future'],
                  actual_long['predictions'],
                  equal_nan=False,
              ), canonical

              # Wide Power BI file must carry the same routed point/interval forecasts and route metadata.
              forecast_col = f'{legacy}_forecast'
              lower_col = f'{legacy}_forecast_lower'
              upper_col = f'{legacy}_forecast_upper'
              route_col = f'{canonical}_forecast_route'
              for column in [forecast_col, lower_col, upper_col, route_col]:
                  assert column in wide.columns, (canonical, column)
              actual_wide = wide.merge(
                  expected[['ds', 'predictions', '0.2', '0.8', 'scenario']],
                  on='ds', how='inner'
              )
              assert len(actual_wide) == 24, (canonical, len(actual_wide))
              assert np.allclose(actual_wide[forecast_col], actual_wide['predictions']), canonical
              assert np.allclose(actual_wide[lower_col], actual_wide['0.2']), canonical
              assert np.allclose(actual_wide[upper_col], actual_wide['0.8']), canonical
              assert (actual_wide[route_col] == actual_wide['scenario']).all(), canonical

          assert 'hourly_routing_version' in wide.columns
          assert 'hourly_weather_routing_enabled' in wide.columns
          print(routed.groupby(['target_name', 'scenario']).size())
          print('All six validated routes reached both production output formats.')
          PY

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-target-routing-runtime-smoke
          path: |
            hourly_feature_routing.csv
            chronos_forecast.csv
            ED_Hourly_Forecasts_Anomalies_v1.0.csv
          if-no-files-found: warn
