name: Interval arrival day CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/arrival_day_policy.py'
      - 'scripts/experiments/arrival_day/**'
      - 'scripts/daily_arrival_quality.py'
      - 'scripts/forecast_intraday_daily_inflow.py'
      - 'scripts/intraday_day_completion_model.py'
      - 'scripts/evaluation/prospective/**'
      - 'tests/test_interval_arrival_day.py'
      - '.github/workflows/interval-arrival-day-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chronos-requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r chronos-requirements.txt pytest scikit-learn
      - name: Verify interval and legacy contracts without credentials
        run: |
          python -m pytest -q tests/test_interval_arrival_day.py tests/test_intraday_day_completion.py tests/test_intraday_hourly_forecast.py tests/test_intraday_prospective_audit.py tests/test_daily_arrival_quality.py tests/test_daily_visits_prospective_score.py tests/test_daily_visit_forecast.py tests/test_daily_visit_explainability.py tests/test_daily_visit_backtest.py tests/test_daily_arrival_outlook.py
