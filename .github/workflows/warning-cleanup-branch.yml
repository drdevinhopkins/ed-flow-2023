name: Warning cleanup branch patch

on:
  push:
    branches: ["github-actions"]
    paths:
      - ".github/workflows/warning-cleanup-branch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply warning cleanup patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f"Expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "requirements.txt",
              "camelot-py[base]",
              "camelot-py",
          )

          replace(
              "scripts/get_current.py",
              '''df["ds"] = pd.to_datetime(\n    df["dateflg"] + " " + (df["timeflg"] - 1).astype(str) + ":00") + datetime.timedelta(hours=1)''',
              '''df["ds"] = pd.to_datetime(\n    df["dateflg"] + " " + (df["timeflg"] - 1).astype(str) + ":00",\n    format="mixed",\n) + datetime.timedelta(hours=1)''',
          )

          replace(
              "scripts/chronos_forecast.py",
              "import pandas as pd\n",
              "import pandas as pd\nimport numpy as np\n",
          )

          replace(
              "scripts/chronos_forecast.py",
              '''for target in targets:\n    recent_df[target+'_hist_anomaly'] = ((recent_df[target] < recent_df[target+'_yhat_lower']) | (recent_df[target] > recent_df[target+'_yhat_upper'])).map({True: 'yes', False: 'no'})\n    recent_df[target+'_hist_colour'] = recent_df.apply(lambda row: '#D13438' if row[target+'_hist_anomaly'] == 'yes' else ('#FFB900' if row[target] > row[target+'_yhat'] else ('#107C10' if row[target] < row[target+'_yhat'] else '#000000')), axis=1)''',
              '''historical_annotations = {}\nfor target in targets:\n    anomaly_mask = (\n        (recent_df[target] < recent_df[target+'_yhat_lower'])\n        | (recent_df[target] > recent_df[target+'_yhat_upper'])\n    )\n    historical_annotations[target+'_hist_anomaly'] = anomaly_mask.map(\n        {True: 'yes', False: 'no'}\n    )\n    historical_annotations[target+'_hist_colour'] = np.select(\n        [\n            anomaly_mask,\n            recent_df[target] > recent_df[target+'_yhat'],\n            recent_df[target] < recent_df[target+'_yhat'],\n        ],\n        ['#D13438', '#FFB900', '#107C10'],\n        default='#000000',\n    )\n\nrecent_df = pd.concat(\n    [recent_df, pd.DataFrame(historical_annotations, index=recent_df.index)],\n    axis=1,\n)''',
          )

          replace(
              "scripts/chronos_forecast.py",
              '''today_mtl = pd.Timestamp.now(tz="America/Montreal").normalize().tz_localize(None)\noutput_df['ds_date'] = output_df['ds'].dt.date\n# Create new column where yesterday is -1, today is 0, tomorrow is 1, etc.\noutput_df['day_offset'] = (output_df['ds_date'] - today_mtl.date()).apply(lambda x: x.days)\noutput_df = output_df.drop(columns=['ds_date'])''',
              '''today_mtl = pd.Timestamp.now(tz="America/Montreal").normalize().tz_localize(None)\n# Defragment after the wide merges before adding the final derived column.\noutput_df = output_df.copy()\n# Create new column where yesterday is -1, today is 0, tomorrow is 1, etc.\noutput_df['day_offset'] = (output_df['ds'].dt.normalize() - today_mtl).dt.days''',
          )

          replace(
              "scripts/calculated_kpis.py",
              '''alerts_df.to_excel('calculated_KPIs_alerts.xlsx', index_label="index")\n\ncritical_alerts_df = pd.DataFrame(critical_alerts)\ncritical_alerts_df.to_csv(\n    'calculated_KPIs_critical_alerts.csv', index=False)  # save alerts to csv\ncritical_alerts_df.to_excel(\n    'calculated_KPIs_critical_alerts.xlsx', index_label="index")''',
              '''# Excel cells are limited to 32,767 characters; the base64 image field can\n# exceed that limit. Keep images in CSV, but omit them from Excel exports.\nalerts_df.drop(columns=['image'], errors='ignore').to_excel(\n    'calculated_KPIs_alerts.xlsx', index_label="index"\n)\n\ncritical_alerts_df = pd.DataFrame(critical_alerts)\ncritical_alerts_df.to_csv(\n    'calculated_KPIs_critical_alerts.csv', index=False)  # save alerts to csv\ncritical_alerts_df.drop(columns=['image'], errors='ignore').to_excel(\n    'calculated_KPIs_critical_alerts.xlsx', index_label="index"\n)''',
          )

          replace(
              "scripts/update_metar.py",
              "import os\nimport requests\n",
              "import io\nimport os\nimport requests\n",
          )

          replace(
              "scripts/update_metar.py",
              '''metar_df = pd.read_csv(\n    'https://www.dropbox.com/scl/fi/7b390c7zu7lg2nug9r21e/full_metar_data.csv?rlkey=ob25xfgvuqth42lruczhszoz3&raw=1')''',
              '''dropbox_app_key = os.environ.get("DROPBOX_APP_KEY")\ndropbox_app_secret = os.environ.get("DROPBOX_APP_SECRET")\ndropbox_refresh_token = os.environ.get("DROPBOX_REFRESH_TOKEN")\n\ntoken_url = "https://api.dropboxapi.com/oauth2/token"\nparams = {\n    "grant_type": "refresh_token",\n    "refresh_token": dropbox_refresh_token,\n    "client_id": dropbox_app_key,\n    "client_secret": dropbox_app_secret,\n}\ntoken_response = requests.post(token_url, data=params, timeout=30)\ntoken_response.raise_for_status()\ndropbox_access_token = token_response.json()['access_token']\ndbx = dropbox.Dropbox(dropbox_access_token)\n\n# Read the canonical METAR history through the authenticated Dropbox API.\n# This avoids transient HTML/error responses from the public share URL being\n# handed to pandas as if they were CSV.\n_, metar_response = dbx.files_download('/metar/full_metar_data.csv')\nmetar_df = pd.read_csv(io.BytesIO(metar_response.content))''',
          )

          replace(
              "scripts/update_metar.py",
              '''dropbox_app_key = os.environ.get("DROPBOX_APP_KEY")\ndropbox_app_secret = os.environ.get("DROPBOX_APP_SECRET")\ndropbox_refresh_token = os.environ.get("DROPBOX_REFRESH_TOKEN")\n\n# exchange the authorization code for an access token:\ntoken_url = "https://api.dropboxapi.com/oauth2/token"\nparams = {\n    "grant_type": "refresh_token",\n    "refresh_token": dropbox_refresh_token,\n    "client_id": dropbox_app_key,\n    "client_secret": dropbox_app_secret\n}\nr = requests.post(token_url, data=params)\n# print(r.text)\n\ndropbox_access_token = r.json()['access_token']\n\ndbx = dropbox.Dropbox(dropbox_access_token)\n\n''',
              '''# Reuse the authenticated Dropbox client created above.\n\n''',
          )
          PY

      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt scripts/get_current.py scripts/chronos_forecast.py scripts/calculated_kpis.py scripts/update_metar.py
          git commit -m "fix: clean hourly warnings and harden METAR update"
          git push
