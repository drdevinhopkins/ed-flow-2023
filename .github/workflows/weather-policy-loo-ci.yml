name: Weather policy leave-one-date-out CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/weather-policy-loo-ci.yml'
      - 'scripts/evaluation/prospective/summarize_shadow_weather_policy_leave_one_date_out.py'

permissions:
  contents: read

jobs:
  policy-loo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Verify leave-one-date-out policy stability
        run: |
          python - <<'PY'
          import pandas as pd
          rows=[]
          dates=['2026-08-25','2026-08-26','2026-08-27']
          # h3-h4 is best on the first two dates but harmful on the third.
          values={
              'all_baseline':[0.0,0.0,0.0],
              'current_weather_policy':[4.0,3.0,-6.0],
              'weather_hours_3_4':[5.0,4.0,-4.0],
              'weather_hours_4':[3.0,2.0,1.0],
          }
          for i,day in enumerate(dates):
              current=values['current_weather_policy'][i]
              for policy,arr in values.items():
                  imp=arr[i]
                  rows.append({
                      'forecast_issue_date':day,
                      'policy':policy,
                      'mae_improvement_pct_vs_baseline':imp,
                      'mae_improvement_pct_vs_current_weather_policy':imp-current,
                  })
          pd.DataFrame(rows).to_csv('/tmp/by-date.csv',index=False)
          PY
          python scripts/evaluation/prospective/summarize_shadow_weather_policy_leave_one_date_out.py \
            /tmp/by-date.csv --output-dir /tmp/out
          python - <<'PY'
          import pandas as pd
          loo=pd.read_csv('/tmp/out/weather-policy-grid-leave-one-date-out.csv')
          summary=pd.read_csv('/tmp/out/weather-policy-grid-leave-one-date-out-summary.csv')
          assert len(loo)==3
          # With Aug 27 held out, h3-h4 should be chosen, then fail on the held-out date.
          fold=loo.loc[loo['held_out_issue_date'].astype(str).eq('2026-08-27')].iloc[0]
          assert fold['selected_policy']=='weather_hours_3_4', fold.to_dict()
          assert not bool(fold['held_out_beats_baseline'])
          assert fold['held_out_improvement_pct']==-4.0
          # Other folds should reveal instability in which policy is selected.
          assert int(summary['n_distinct_selected_policies'].iloc[0]) >= 2
          assert not bool(summary['exploratory_selection_stable_across_dates'].iloc[0])
          assert float(summary['held_out_baseline_win_rate'].iloc[0]) < 1.0
          # Three issue dates are exploratory only; no formal stability claim is allowed.
          assert int(summary['min_issue_dates_for_loo_claim'].iloc[0]) == 28
          assert not bool(summary['loo_evidence_ready'].iloc[0])
          assert summary['loo_status'].iloc[0] == 'insufficient_issue_dates'
          print('Leave-one-date-out diagnostic catches unstable selection and remains exploratory until 28 issue dates.')
          PY
