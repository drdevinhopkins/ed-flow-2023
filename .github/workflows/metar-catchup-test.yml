name: METAR catch-up branch test

on:
  push:
    branches: ["github-actions"]
    paths:
      - ".github/workflows/metar-catchup-test.yml"

permissions:
  contents: write

jobs:
  metar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish run ID
        run: |
          printf 'run_id=%s\nrun_number=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > metar-test-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metar-test-run-id.txt
          git commit -m "test: publish METAR run id [skip ci]"
          git push
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: chronos-requirements.txt
      - name: Install METAR dependencies
        run: pip install pandas dropbox requests python-dotenv
      - name: Update METAR data
        run: python scripts/update_metar.py
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
