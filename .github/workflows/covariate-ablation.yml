name: Covariate ablation backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: chronos-requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-covariate-ablation-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt', 'scripts/backtest_covariate_ablation.py') }}
          restore-keys: |
            huggingface-covariate-ablation-${{ runner.os }}-
            huggingface-chronos2-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt

      - name: Compile validation scripts
        run: |
          python -m py_compile scripts/validate_forecast_inputs.py
          python -m py_compile scripts/backtest_covariate_ablation.py

      - name: Validate live forecast inputs
        run: python scripts/validate_forecast_inputs.py

      - name: Run covariate ablation backtest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p validation-output
          python scripts/backtest_covariate_ablation.py \
            --horizon 24 \
            --num-cutoffs 8 \
            --spacing-hours 168 \
            --max-history-days 180 \
            --min-history-hours 336 \
            --output-dir validation-output

      - name: Upload ablation results
        uses: actions/upload-artifact@v4
        with:
          name: covariate-ablation-full
          path: validation-output/*.csv
