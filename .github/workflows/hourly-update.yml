# Publish and validate shared inputs before starting any hourly model.
# v2, v2.1 and the legacy forecast independently follow this workflow's success.

name: Hourly update

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  repository_dispatch:
      types: [trigger_get_current_data_action]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Get current data
      run: python scripts/get_current.py
      continue-on-error: true
      env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
    - name: Update METAR data
      run: python scripts/update_metar.py
      continue-on-error: true
      env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
    - name: Update ShiftAdmin data
      run: python scripts/shiftadmin.py
      continue-on-error: true
      env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          SHIFTADMIN_USER: ${{ secrets.SHIFTADMIN_USER }}
          SHIFTADMIN_PASS: ${{ secrets.SHIFTADMIN_PASS }}
    - name: Validate forecast inputs
      run: python scripts/validate_forecast_inputs.py
    - name: Check for failed steps
      if: failure()
      run: echo "⚠️ Some steps failed, but workflow continued."
