name: Weather high-congestion diagnostics CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/weather-high-congestion-ci.yml'
      - 'scripts/evaluation/prospective/summarize_shadow_weather_high_congestion.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-congestion-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install minimal dependencies
        run: pip install pandas numpy

      - name: Verify unique-hour threshold and issue-date balancing
        run: |
          python - <<'PY'
          import sys
          import pandas as pd

          sys.path.insert(0, 'scripts/evaluation/prospective')
          from summarize_shadow_weather_high_congestion import (
              summarize,
              summarize_by_issue_date,
              summarize_issue_date_balanced,
          )

          rows = []
          # Four unique realized hours: q75 must be 32.5. Repeating the 40-count
          # hour many times must not move the threshold to 40.
          actuals = [10.0, 20.0, 30.0, 40.0]
          for i, actual in enumerate(actuals):
              rows.append({
                  'ds': f'2026-08-25 {10+i:02d}:00:00',
                  'target_name': 'Total_TBS',
                  'horizon_band': 'h01_04',
                  'actual': actual,
                  'weather_route_active': True,
                  'baseline_absolute_error': 4.0,
                  'weather_absolute_error': 3.0 if actual == 40 else 4.0,
                  'paired_absolute_error_delta': 1.0 if actual == 40 else 0.0,
                  'weather_wins': actual == 40,
                  'forecast_run_id': f'run-{i}',
                  'forecast_issue_date': '2026-08-25' if i < 3 else '2026-08-26',
              })
          # Duplicate the high-congestion target hour heavily; this must not alter q75.
          for j in range(8):
              rows.append({
                  'ds': '2026-08-25 13:00:00',
                  'target_name': 'Total_TBS',
                  'horizon_band': 'h01_04',
                  'actual': 40.0,
                  'weather_route_active': True,
                  'baseline_absolute_error': 4.0,
                  'weather_absolute_error': 3.0,
                  'paired_absolute_error_delta': 1.0,
                  'weather_wins': True,
                  'forecast_run_id': f'dup-{j}',
                  'forecast_issue_date': '2026-08-26',
              })

          detail = pd.DataFrame(rows)
          pooled = summarize(detail)
          by_date = summarize_by_issue_date(detail)
          balanced = summarize_issue_date_balanced(detail)

          assert len(pooled) == 1
          assert abs(float(pooled.iloc[0]['high_congestion_threshold_q75']) - 32.5) < 1e-9
          assert int(pooled.iloc[0]['n_unique_target_hours']) == 1
          assert set(by_date['forecast_issue_date'].astype(str)) == {'2026-08-26'}
          assert int(balanced.iloc[0]['n_issue_dates']) == 1
          assert float(balanced.iloc[0]['issue_date_win_rate']) == 1.0
          print('High-congestion thresholds use unique realized hours and summaries balance by issue date.')
          PY
