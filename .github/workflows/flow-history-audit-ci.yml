name: Flow history audit CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/evaluation/audit_flow_history.py'
      - 'tests/test_flow_history_audit.py'
      - '.github/workflows/flow-history-audit-ci.yml'
  push:
    branches: [fix/historical-data-quality-audit]
    paths:
      - 'scripts/evaluation/audit_flow_history.py'
      - 'tests/test_flow_history_audit.py'
      - '.github/workflows/flow-history-audit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - run: python tests/test_flow_history_audit.py
      - run: python -m py_compile scripts/evaluation/audit_flow_history.py
