name: Retrospective on-call decision replay

on:
  workflow_dispatch:
    inputs:
      horizon:
        description: On-call probability horizon (hours)
        required: false
        default: "6"
      pressure_percentile_threshold:
        description: Historical pressure percentile used to define an alert episode
        required: false
        default: "95"
      bad_outcome_quantile:
        description: Historical quantile defining each core congestion threshold
        required: false
        default: "0.90"
  push:
    branches:
      - experiment/oncall-retrospective-replay
    paths:
      - scripts/experiments/oncall/**
      - scripts/forecast_oncall_probability.py
      - hourly_oncall_used_for_busy_since_2022.csv
      - .github/workflows/oncall-retrospective-replay.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy catboost scikit-learn holidays dropbox python-dotenv requests

      - name: Run independent calibration benchmark
        env:
          HORIZON: ${{ github.event.inputs.horizon || '6' }}
          BAD_OUTCOME_QUANTILE: ${{ github.event.inputs.bad_outcome_quantile || '0.90' }}
        run: |
          mkdir -p artifacts/oncall-retrospective
          python scripts/experiments/oncall/retrospective_oncall_decision_replay.py \
            --horizon "$HORIZON" \
            --alert-threshold 0.70 \
            --bad-outcome-quantile "$BAD_OUTCOME_QUANTILE" \
            --outcome-hours 6 \
            --top-n 20 \
            --output-dir artifacts/oncall-retrospective

      - name: Run percentile-based pressure analysis
        env:
          HORIZON: ${{ github.event.inputs.horizon || '6' }}
          PRESSURE_THRESHOLD: ${{ github.event.inputs.pressure_percentile_threshold || '95' }}
          BAD_OUTCOME_QUANTILE: ${{ github.event.inputs.bad_outcome_quantile || '0.90' }}
        run: |
          python scripts/experiments/oncall/retrospective_oncall_pressure_analysis.py \
            --horizon "$HORIZON" \
            --pressure-percentile-threshold "$PRESSURE_THRESHOLD" \
            --bad-outcome-quantile "$BAD_OUTCOME_QUANTILE" \
            --outcome-hours 6 \
            --major-core-count 3 \
            --matches 5 \
            --top-n 20 \
            --output-dir artifacts/oncall-retrospective

      - name: Show pressure summary
        if: always()
        run: |
          if test -f artifacts/oncall-retrospective/oncall_pressure_performance.csv; then
            echo '### On-call pressure performance' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/oncall-retrospective/oncall_pressure_performance.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/oncall-retrospective/oncall_pressure_thresholds.csv; then
            echo '### Pressure thresholds' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/oncall-retrospective/oncall_pressure_thresholds.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/oncall-retrospective/oncall_pressure_top_cases.csv; then
            echo '### Top pressure episodes' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            head -n 21 artifacts/oncall-retrospective/oncall_pressure_top_cases.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oncall-retrospective-replay
          path: artifacts/oncall-retrospective/
          if-no-files-found: warn
