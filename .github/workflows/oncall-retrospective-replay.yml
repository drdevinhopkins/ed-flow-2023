name: Retrospective on-call decision replay

on:
  workflow_dispatch:
    inputs:
      horizon:
        description: On-call probability horizon (hours)
        required: false
        default: "6"
      pressure_percentile_threshold:
        description: Historical need-pressure percentile used to define an alert episode
        required: false
        default: "99"
      bad_outcome_quantile:
        description: Historical quantile defining each core congestion threshold
        required: false
        default: "0.90"
      late_call_hour:
        description: Sensitivity proxy hour at/after which activation is late-evening constrained
        required: false
        default: "21"
      min_rest_buffer_hours:
        description: Sensitivity proxy for hours before the on-call physician's next non-on-call shift
        required: false
        default: "10"
  push:
    branches:
      - experiment/oncall-retrospective-replay
    paths:
      - scripts/experiments/oncall/**
      - scripts/forecast_oncall_probability.py
      - hourly_oncall_used_for_busy_since_2022.csv
      - .github/workflows/oncall-retrospective-replay.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy catboost scikit-learn holidays dropbox python-dotenv requests

      - name: Run independent calibration benchmark
        env:
          HORIZON: ${{ github.event.inputs.horizon || '6' }}
          BAD_OUTCOME_QUANTILE: ${{ github.event.inputs.bad_outcome_quantile || '0.90' }}
        run: |
          mkdir -p artifacts/oncall-retrospective
          python scripts/experiments/oncall/retrospective_oncall_decision_replay.py \
            --horizon "$HORIZON" \
            --alert-threshold 0.70 \
            --bad-outcome-quantile "$BAD_OUTCOME_QUANTILE" \
            --outcome-hours 6 \
            --top-n 20 \
            --output-dir artifacts/oncall-retrospective

      - name: Run percentile-based pressure analysis
        env:
          HORIZON: ${{ github.event.inputs.horizon || '6' }}
          PRESSURE_THRESHOLD: ${{ github.event.inputs.pressure_percentile_threshold || '99' }}
          BAD_OUTCOME_QUANTILE: ${{ github.event.inputs.bad_outcome_quantile || '0.90' }}
        run: |
          python scripts/experiments/oncall/retrospective_oncall_pressure_analysis.py \
            --horizon "$HORIZON" \
            --pressure-percentile-threshold "$PRESSURE_THRESHOLD" \
            --bad-outcome-quantile "$BAD_OUTCOME_QUANTILE" \
            --outcome-hours 6 \
            --major-core-count 3 \
            --matches 5 \
            --top-n 30 \
            --output-dir artifacts/oncall-retrospective

      - name: Run availability-adjusted need-pressure analysis
        env:
          HORIZON: ${{ github.event.inputs.horizon || '6' }}
          PRESSURE_THRESHOLD: ${{ github.event.inputs.pressure_percentile_threshold || '99' }}
          BAD_OUTCOME_QUANTILE: ${{ github.event.inputs.bad_outcome_quantile || '0.90' }}
          LATE_CALL_HOUR: ${{ github.event.inputs.late_call_hour || '21' }}
          MIN_REST_BUFFER_HOURS: ${{ github.event.inputs.min_rest_buffer_hours || '10' }}
        run: |
          python scripts/experiments/oncall/retrospective_oncall_availability_adjusted.py \
            --horizon "$HORIZON" \
            --pressure-percentile-threshold "$PRESSURE_THRESHOLD" \
            --bad-outcome-quantile "$BAD_OUTCOME_QUANTILE" \
            --outcome-hours 6 \
            --major-core-count 3 \
            --matches 5 \
            --top-n 30 \
            --late-call-hour "$LATE_CALL_HOUR" \
            --min-rest-buffer-hours "$MIN_REST_BUFFER_HOURS" \
            --output-dir artifacts/oncall-retrospective

      - name: Show pressure summary
        if: always()
        run: |
          if test -f artifacts/oncall-retrospective/oncall_availability_adjusted_performance.csv; then
            echo '### Availability-adjusted on-call need pressure' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/oncall-retrospective/oncall_availability_adjusted_performance.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/oncall-retrospective/oncall_availability_adjusted_summary.csv; then
            echo '### High-pressure hours by callability' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/oncall-retrospective/oncall_availability_adjusted_summary.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/oncall-retrospective/oncall_callability_sensitivity.csv; then
            echo '### Callability sensitivity' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/oncall-retrospective/oncall_callability_sensitivity.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/oncall-retrospective/oncall_availability_adjusted_top_cases.csv; then
            echo '### Top availability-adjusted episodes' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            head -n 31 artifacts/oncall-retrospective/oncall_availability_adjusted_top_cases.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oncall-retrospective-replay
          path: artifacts/oncall-retrospective/
          if-no-files-found: warn
