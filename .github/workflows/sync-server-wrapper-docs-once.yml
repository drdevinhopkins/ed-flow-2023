name: Sync server wrapper docs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-server-wrapper-docs-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate server wrapper shell syntax
        run: bash -n scripts/run_ed_flow_update.sh

      - name: Update README local hourly pipeline section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          old = '''## Existing hourly pipeline

The existing hourly pipeline remains intentionally unchanged by the v2 work.

The local wrapper runs the core sequence:

```text
get_current.py
  → shiftadmin.py
  → chronos_forecast.py
  → forecast_oncall_impact.py
  → forecast_oncall_probability.py
  → calculated_kpis.py
  → alerts.py
```

The Dropbox watcher in `scripts/watch_dropbox_pdf.py` can trigger the wrapper when `/hourlyreport.pdf` changes.
'''

          new = '''## Local JGH hourly pipeline

On `jgh000533svaps`, the Dropbox watcher triggers `scripts/run_ed_flow_update.sh` whenever `/hourlyreport.pdf` changes. The wrapper is the canonical local hourly sequence:

```text
get_current.py
  → update_metar.py
  → shiftadmin.py
  → validate_forecast_inputs.py
  → chronos_forecast.py
  → forecast_oncall_impact.py
  → forecast_oncall_probability.py
  → calculated_kpis.py
  → alerts.py
  → hourly_forecast_v2.py  (additive/non-blocking)
```

The validation gate prevents stale or incomplete ED, staffing, or weather inputs from silently generating a forecast. The established legacy/on-call/KPI/alert outputs remain the blocking production path. `hourly_forecast_v2.py` runs last and non-blocking so a v2 failure cannot prevent those established outputs from updating.

The wrapper explicitly keeps `CHRONOS_HOURLY_ENABLE_WEATHER_ROUTING=0` until prospective hourly weather validation is sufficient. `weather.csv` itself continues to be refreshed by the separate 4-hour weather timer; the wrapper refreshes METAR on each hourly-report update.
'''

          if old not in text:
              raise SystemExit('README hourly pipeline block did not match expected text')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit README sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --check
          git commit -m 'Sync README with JGH hourly wrapper'
          git push
