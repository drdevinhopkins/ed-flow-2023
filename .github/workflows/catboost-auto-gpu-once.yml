name: Patch CatBoost auto GPU once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catboost-auto-gpu-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Patch on-call probability GPU selection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/forecast_oncall_probability.py')
          text = path.read_text()

          old_import = 'from catboost import CatBoostClassifier\n'
          new_import = 'from catboost import CatBoostClassifier\nfrom catboost.utils import get_gpu_device_count\n'
          if old_import not in text:
              raise SystemExit('CatBoost import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_constants = '''RANDOM_SEED = 42\nSTRETCHER_CAPACITY = 53.0\n'''
          new_constants = '''RANDOM_SEED = 42\nSTRETCHER_CAPACITY = 53.0\nCATBOOST_GPU_COUNT = get_gpu_device_count()\nCATBOOST_TASK_TYPE = "GPU" if CATBOOST_GPU_COUNT > 0 else "CPU"\n'''
          if old_constants not in text:
              raise SystemExit('Constants anchor not found')
          text = text.replace(old_constants, new_constants, 1)

          old_model = '''    model = CatBoostClassifier(\n        iterations=700,\n        depth=7,\n        learning_rate=0.04,\n        loss_function="Logloss",\n        eval_metric="AUC",\n        random_seed=RANDOM_SEED,\n        auto_class_weights="Balanced",\n        verbose=False,\n        allow_writing_files=False,\n    )\n'''
          new_model = '''    model_params: dict[str, object] = {\n        "iterations": 700,\n        "depth": 7,\n        "learning_rate": 0.04,\n        "loss_function": "Logloss",\n        "eval_metric": "AUC",\n        "random_seed": RANDOM_SEED,\n        "auto_class_weights": "Balanced",\n        "verbose": False,\n        "allow_writing_files": False,\n        "task_type": CATBOOST_TASK_TYPE,\n    }\n    if CATBOOST_TASK_TYPE == "GPU":\n        # Use only logical device 0. On jgh000533svaps the wrapper sets\n        # CUDA_VISIBLE_DEVICES=0, so this maps to physical GPU 0 and cannot\n        # consume GPUs reserved for Scribbler.\n        model_params["devices"] = "0"\n\n    model = CatBoostClassifier(**model_params)\n'''
          if old_model not in text:
              raise SystemExit('Model constructor anchor not found')
          text = text.replace(old_model, new_model, 1)

          old_main = '''def main() -> None:\n    MODEL_DIR.mkdir(parents=True, exist_ok=True)\n'''
          new_main = '''def main() -> None:\n    MODEL_DIR.mkdir(parents=True, exist_ok=True)\n    if CATBOOST_TASK_TYPE == "GPU":\n        print(\n            f"CatBoost training device: GPU 0 "\n            f"({CATBOOST_GPU_COUNT} visible CatBoost GPU(s))"\n        )\n    else:\n        print("CatBoost training device: CPU (no CatBoost-compatible GPU visible)")\n'''
          if old_main not in text:
              raise SystemExit('main anchor not found')
          text = text.replace(old_main, new_main, 1)

          path.write_text(text)
          PY

      - name: Validate patched Python and wrapper
        run: |
          python -m py_compile scripts/forecast_oncall_probability.py
          bash -n scripts/run_ed_flow_update.sh

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/forecast_oncall_probability.py
          git diff --cached --check
          git commit -m 'Auto-select GPU for on-call CatBoost training'
          git push
