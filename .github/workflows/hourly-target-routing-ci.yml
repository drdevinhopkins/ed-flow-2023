name: Hourly forecast v2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - chronos2-hourly-target-routing
    paths:
      - '.github/workflows/hourly-target-routing-ci.yml'
      - '.github/workflows/hourly-forecast-v2.yml'
      - 'scripts/hourly_feature_routing.py'
      - 'scripts/hourly_forecast_v2.py'
      - 'tests/test_hourly_feature_routing.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hourly-target-routing-ci.yml'
      - '.github/workflows/hourly-forecast-v2.yml'
      - 'scripts/hourly_feature_routing.py'
      - 'scripts/hourly_forecast_v2.py'
      - 'tests/test_hourly_feature_routing.py'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile v2 routing code
        run: |
          python -m py_compile scripts/hourly_feature_routing.py
          python -m py_compile scripts/hourly_forecast_v2.py

      - name: Test routing table
        run: python tests/test_hourly_feature_routing.py

      - name: Verify legacy execution files match main
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- .github/workflows/hourly-update.yml scripts/run_ed_flow_update.sh scripts/chronos_forecast_v2.py

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
