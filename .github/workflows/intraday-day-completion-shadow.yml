name: Intraday day-completion shadow forecast

on:
  workflow_dispatch:
  push:
    branches:
      - codex/intraday-day-completion
    paths:
      - '.github/workflows/intraday-day-completion-shadow.yml'
      - 'scripts/evaluation/prospective/run_shadow_intraday_day_completion.py'
      - 'scripts/evaluation/prospective/score_shadow_intraday_day_completion.py'
      - 'scripts/evaluation/prospective/check_shadow_intraday_day_completion.py'
      - 'scripts/evaluation/prospective/build_intraday_production_readiness.py'
      - 'tests/test_shadow_intraday_day_completion.py'
      - 'scripts/evaluation/prospective/run_intraday_shadow_cycle.sh'
      - 'validation/intraday-day-completion-shadow/shadow-trigger.txt'

permissions:
  contents: write

concurrency:
  group: intraday-day-completion-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install shadow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn holidays requests
      - name: Compile and test shadow safeguards
        run: |
          python -m py_compile scripts/evaluation/prospective/run_shadow_intraday_day_completion.py
          python -m py_compile scripts/evaluation/prospective/score_shadow_intraday_day_completion.py
          python -m py_compile scripts/evaluation/prospective/check_shadow_intraday_day_completion.py
          python -m py_compile scripts/evaluation/prospective/build_intraday_production_readiness.py
          python -m unittest tests.test_shadow_intraday_day_completion -v
      - name: Build cutoff-safe historical weather
        run: |
          python scripts/build_weather_history.py \
            --start-date 2021-01-01 \
            --output "$RUNNER_TEMP/weather_backfilled.csv"
      - name: Generate shadow-only forecast
        run: |
          mkdir -p validation/intraday-day-completion-shadow
          python scripts/evaluation/prospective/run_shadow_intraday_day_completion.py \
            --weather-csv "$RUNNER_TEMP/weather_backfilled.csv" \
            --output-csv validation/intraday-day-completion-shadow/forecasts.csv \
            --status-json validation/intraday-day-completion-shadow/latest-status.json \
            --status-history-csv validation/intraday-day-completion-shadow/status-history.csv \
            --metadata-json validation/intraday-day-completion-shadow/model-metadata.json \
            --artifact-joblib "$RUNNER_TEMP/intraday-ensemble-v1.joblib" \
            --artifact-manifest-json validation/intraday-day-completion-shadow/artifact-manifest.json
      - name: Score completed shadow days
        run: |
          python scripts/evaluation/prospective/score_shadow_intraday_day_completion.py \
            --forecasts-csv validation/intraday-day-completion-shadow/forecasts.csv \
            --scores-csv validation/intraday-day-completion-shadow/scores.csv \
            --summary-json validation/intraday-day-completion-shadow/score-summary.json \
            --readiness-json validation/intraday-day-completion-shadow/prospective-readiness.json
      - name: Check shadow health
        run: |
          python scripts/evaluation/prospective/check_shadow_intraday_day_completion.py \
            --status-json validation/intraday-day-completion-shadow/latest-status.json \
            --status-history-csv validation/intraday-day-completion-shadow/status-history.csv \
            --forecasts-csv validation/intraday-day-completion-shadow/forecasts.csv \
            --artifact-manifest-json validation/intraday-day-completion-shadow/artifact-manifest.json \
            --readiness-json validation/intraday-day-completion-shadow/prospective-readiness.json \
            --output-json validation/intraday-day-completion-shadow/monitor-health.json
      - name: Build production readiness assessment
        if: always()
        run: |
          python scripts/evaluation/prospective/build_intraday_production_readiness.py \
            --retrospective-json validation/intraday-day-completion/readiness.json \
            --prospective-json validation/intraday-day-completion-shadow/prospective-readiness.json \
            --health-json validation/intraday-day-completion-shadow/monitor-health.json \
            --artifact-manifest-json validation/intraday-day-completion-shadow/artifact-manifest.json \
            --output-json validation/intraday-day-completion-shadow/production-readiness-assessment.json
      - name: Upload shadow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-day-completion-shadow
          path: |
            validation/intraday-day-completion-shadow/*
            ${{ runner.temp }}/intraday-ensemble-v1.joblib
      - name: Append branch shadow record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f validation/intraday-day-completion-shadow
          if ! git diff --cached --quiet; then
            git commit -m "Record intraday completion shadow forecast [skip ci]"
            git push
          fi
