name: Chronos-2 daily visits forecast

on:
  push:
    branches:
      - chronos2-weather-features
    paths:
      - 'scripts/forecast_daily_visits.py'
      - 'scripts/daily_weather_feature_set.py'
      - 'scripts/live_weather_forecast.py'
      - 'scripts/weather_features.py'
      - 'scripts/build_weather_history.py'
      - 'scripts/holiday_features.py'
      - 'scripts/backtest_holiday_features.py'
      - 'scripts/backtest_daily_holiday_targeted.py'
      - 'tests/test_daily_visit_forecast.py'
      - '.github/workflows/daily-visits-forecast.yml'
      - 'data/jgh_ramq_holidays.csv'
      - 'chronos-requirements.txt'
  workflow_dispatch:
  # GitHub schedules run from the default branch only. Once merged, this becomes the
  # operational daily forecast and archives exact D+1..D+7 forecast-time covariates.
  schedule:
    - cron: '15 10 * * *'

permissions:
  contents: write

concurrency:
  group: chronos2-daily-visits-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Publish branch validation run id
        if: github.ref_name != 'main'
        shell: bash
        run: |
          mkdir -p validation/daily-visits-forecast
          printf 'run_id=%s\nrun_number=%s\nsha=%s\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.sha }}' \
            > validation/daily-visits-forecast/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f validation/daily-visits-forecast/run-id.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record daily visits forecast run id [skip ci]"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: chronos-requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-daily-visits-${{ runner.os }}-${{ hashFiles('chronos-requirements.txt') }}
          restore-keys: |
            huggingface-daily-weather-${{ runner.os }}-
            huggingface-daily-calendar-context-${{ runner.os }}-
            huggingface-chronos2-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chronos-requirements.txt

      - name: Compile production forecast code
        run: |
          python -m py_compile scripts/daily_weather_feature_set.py
          python -m py_compile scripts/live_weather_forecast.py
          python -m py_compile scripts/forecast_daily_visits.py
          python -m py_compile tests/test_daily_visit_forecast.py

      - name: Test promoted feature contract
        run: python tests/test_daily_visit_forecast.py

      - name: Run current 7-day forecast
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        shell: bash
        run: |
          extra_args=()
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            extra_args+=(--no-dropbox)
          fi
          python scripts/forecast_daily_visits.py \
            --horizon-days 7 \
            --context-days 1095 \
            --min-history-days 28 \
            --output daily_visits_forecast.csv \
            --weather-snapshot-output daily_visits_weather_snapshot.csv \
            "${extra_args[@]}" \
            2>&1 | tee daily_visits_forecast.log

      - name: Validate forecast output
        run: |
          python - <<'PY'
          import pandas as pd
          forecast = pd.read_csv('daily_visits_forecast.csv')
          weather = pd.read_csv('daily_visits_weather_snapshot.csv')
          assert len(forecast) == 7, f'expected 7 forecast days, got {len(forecast)}'
          assert forecast['ds'].nunique() == 7
          assert forecast['daily_visits_prediction'].notna().all()
          assert (forecast['weather_feature_set'] == 'raw_plus_snow').all()
          assert forecast['horizon_day'].tolist() == list(range(1, 8))
          assert forecast['history_days'].min() >= 28
          assert forecast['temp_mean'].notna().all()
          assert forecast['wind_max'].notna().all()
          assert forecast['snowfall_sum'].notna().all()
          assert len(weather) == 7
          assert weather['ds'].tolist() == forecast['ds'].tolist()
          assert weather['horizon_day'].tolist() == list(range(1, 8))
          assert weather.drop(columns=['forecast_generated_at_utc']).notna().all().all()
          print(forecast.to_string(index=False))
          PY

      - name: Upload forecast artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos2-daily-visits-forecast
          path: |
            daily_visits_forecast.csv
            daily_visits_weather_snapshot.csv
            daily_visits_forecast.log

      - name: Record latest branch forecast
        if: github.ref_name != 'main'
        shell: bash
        run: |
          mkdir -p validation/daily-visits-forecast
          cp daily_visits_forecast.csv validation/daily-visits-forecast/latest.csv
          cp daily_visits_weather_snapshot.csv validation/daily-visits-forecast/latest-weather.csv
          tail -n 500 daily_visits_forecast.log > validation/daily-visits-forecast/latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f validation/daily-visits-forecast
          if ! git diff --cached --quiet; then
            git commit -m "Record daily visits forecast smoke test [skip ci]"
            git push
          fi
