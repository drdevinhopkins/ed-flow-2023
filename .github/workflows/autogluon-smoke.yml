name: AutoGluon smoke test

on:
  push:
    branches: [autogluon]
    paths:
      - '.github/workflows/autogluon-smoke.yml'
      - 'scripts/autogluon_backtest.py'
      - 'scripts/autogluon_backtest_safe.py'
      - 'scripts/chronos_forecast_autogluon.py'
      - 'requirements-autogluon.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/autogluon-smoke.yml'
      - 'scripts/autogluon_backtest.py'
      - 'scripts/autogluon_backtest_safe.py'
      - 'scripts/chronos_forecast_autogluon.py'
      - 'requirements-autogluon.txt'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autogluon

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install AutoGluon dependencies
        run: python -m pip install -r requirements-autogluon.txt

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Run leakage-safe smoke backtest
        env:
          AUTOGLUON_VALIDATION_WINDOWS: '1'
          AUTOGLUON_HOLDOUT_WINDOWS: '1'
          AUTOGLUON_VAL_STEP_SIZE: '24'
          AUTOGLUON_TIME_LIMIT: '900'
          AUTOGLUON_BATCH_SIZE: '8'
          AUTOGLUON_INCLUDE_WEATHER: '0'
        run: python scripts/autogluon_backtest_safe.py

      - name: Show outputs
        if: always()
        run: |
          ls -lh autogluon_*.csv 2>/dev/null || true
          for f in autogluon_leaderboard.csv autogluon_backtest_overview.csv autogluon_backtest_summary.csv; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              head -n 40 "$f"
            fi
          done
